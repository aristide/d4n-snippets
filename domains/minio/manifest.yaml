id: minio
name: MinIO Object Storage
version: 1.0.0
description: >
  Python examples for interacting with MinIO object storage:
  listing buckets, browsing files, and basic S3-compatible operations.
locales: [en, fr]
authors: []
tags: [minio, s3, object-storage, buckets]

code:
  - file: list_buckets_and_files.ipynb
    title: List Buckets and Files in MinIO
    description: Connect to MinIO using environment variables and list all buckets and their contents
    type: notebook
    code_lang: python
    difficulty: beginner
    estimated_time: 10min
    tags: [minio, buckets, list-objects, environment-variables]
    kernel: python3
    i18n:
      fr:
        title: "Lister les buckets et fichiers dans MinIO"
        description: "Se connecter à MinIO avec des variables d'environnement et lister tous les buckets et leur contenu"

  - file: csv_parquet_aggregation.ipynb
    title: Read CSV & Parquet from MinIO, Aggregate, and Save Back
    description: Read CSV and Parquet files directly from MinIO into DataFrames (no download), perform aggregations, and save results as Parquet to another bucket
    type: notebook
    code_lang: python
    difficulty: intermediate
    estimated_time: 15min
    tags: [minio, csv, parquet, pandas, s3fs, aggregation, dataframe]
    kernel: python3
    i18n:
      fr:
        title: "Lire CSV & Parquet depuis MinIO, agréger et sauvegarder"
        description: "Lire des fichiers CSV et Parquet directement depuis MinIO dans des DataFrames (sans téléchargement), effectuer des agrégations et sauvegarder les résultats en Parquet dans un autre bucket"

  - file: ad_user_group_policy.sh
    title: Add AD Users/Groups and Attach Policies
    description: Bash script to add Active Directory users and groups to MinIO and attach IAM policies using the mc CLI
    type: script
    code_lang: bash
    difficulty: intermediate
    estimated_time: 10min
    tags: [minio, mc, active-directory, ldap, iam, policy, users, groups]
    i18n:
      fr:
        title: "Ajouter des utilisateurs/groupes AD et attacher des politiques"
        description: "Script bash pour ajouter des utilisateurs et groupes Active Directory à MinIO et attacher des politiques IAM avec la CLI mc"

snippet_files:
  - file: ad_policy_commands.json
    title: MinIO AD Policy Commands
    tags: [minio, mc, active-directory, ldap, policy]
    i18n:
      fr:
        title: "Commandes MinIO pour politiques AD"

  - file: minio_client_basics.json
    title: MinIO Python Client Basics
    tags: [minio, python, client, buckets, objects]
    i18n:
      fr:
        title: "Bases du client Python MinIO"

  - file: s3fs_dataframe_operations.json
    title: S3FS DataFrame Operations with MinIO
    tags: [minio, s3fs, pandas, csv, parquet, dataframe, aggregation]
    i18n:
      fr:
        title: "Opérations DataFrame avec S3FS et MinIO"
