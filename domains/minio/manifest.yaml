id: minio
name: MinIO Object Storage
version: 1.0.0
description: >
  Python examples for interacting with MinIO object storage:
  listing buckets, browsing files, and basic S3-compatible operations.
locales: [en, fr]
authors: []
tags: [minio, s3, object-storage, buckets]

code:
  - file: list_buckets_and_files.ipynb
    title: List Buckets and Files in MinIO
    description: Connect to MinIO using environment variables and list all buckets and their contents
    type: notebook
    code_lang: python
    difficulty: beginner
    estimated_time: 10min
    tags: [minio, buckets, list-objects, environment-variables]
    kernel: python3
    i18n:
      fr:
        title: "Lister les buckets et fichiers dans MinIO"
        description: "Se connecter à MinIO avec des variables d'environnement et lister tous les buckets et leur contenu"

  - file: csv_parquet_aggregation.ipynb
    title: Read CSV & Parquet from MinIO, Aggregate, and Save Back
    description: Read CSV and Parquet files directly from MinIO into DataFrames (no download), perform aggregations, and save results as Parquet to another bucket
    type: notebook
    code_lang: python
    difficulty: intermediate
    estimated_time: 15min
    tags: [minio, csv, parquet, pandas, s3fs, aggregation, dataframe]
    kernel: python3
    i18n:
      fr:
        title: "Lire CSV & Parquet depuis MinIO, agréger et sauvegarder"
        description: "Lire des fichiers CSV et Parquet directement depuis MinIO dans des DataFrames (sans téléchargement), effectuer des agrégations et sauvegarder les résultats en Parquet dans un autre bucket"

snippet_files: []
